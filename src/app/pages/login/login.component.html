<section class="login-container">
    <h2>Login to Your Account</h2>
    <p>Access your account and start shopping!</p>
    (ngSubmit)="onSubmit()" 
    <form [formGroup]="loginForm" >
      <div class="input-group">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" required placeholder="Enter your email" />
        <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="error-message">
          Valid email is required.
        </div>
      </div>
  
      <div class="input-group">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" required placeholder="Enter your password" />
        <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="error-message">
          Password must be at least 6 characters.
        </div>
      </div>
  
      <button type="submit" [disabled]="loginForm.invalid" class="login-btn">Login</button>
      
      <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>
  
      <p class="register-link">Don't have an account? <a routerLink="/register">Sign up</a></p>
    </form>
  </section>
