<div class="container">
    <div class="row">
      <div class="col-md-6">
        <img [src]="product.image" class="img-fluid" alt="{{ product.name }}">
      </div>
      <div class="col-md-6">
        <h2>{{ product.name }}</h2>
        <p>{{ product.description }}</p>
        <h3>${{ product.price }}</h3>
        <button class="btn btn-success" (click)="addToCart()">Add to Cart</button>
      </div>
    </div>
  </div>
