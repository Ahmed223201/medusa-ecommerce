<section class="hero">
  <h1>Welcome to Site E-Commerce</h1>
  <p>Find the best deals on our products.</p>
  <a routerLink="/products" class="shop-now-btn">Shop Now</a>
</section>

<section class="featured-products">
  <h2>Featured Products</h2>
  <div class="products">
    <div class="product-card" *ngFor="let product of products">
      <img [src]="product.image" alt="{{ product.name }}">
      <h3>{{ product.name }}</h3>
      <p>{{ product.price }} TND</p>
      <a [routerLink]="'/products/' + product.id" class="view-details">View Details</a>
    </div>
  </div>
</section>
