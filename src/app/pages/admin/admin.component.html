<div class="admin-dashboard-title">
  <h1>Administrator Dashboard</h1>
</div>
<div class="admin-container">
  <div class="admin-content">
    <div class="product-form wide-form">
      <h2>{{ editMode ? 'Edit Product' : 'Add New Product' }}</h2>
      <form (ngSubmit)="saveProduct()">
        <div class="form-group">
          <label for="title">Title</label>
          <input type="text" id="title" name="title" [(ngModel)]="currentProduct.title" required>
        </div>
        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" name="description" [(ngModel)]="currentProduct.description" rows="3"></textarea>
        </div>
        <div class="form-group">
          <label for="price">Price</label>
          <input type="number" id="price" name="price" [(ngModel)]="currentProduct.price" min="0" step="0.01" required>
        </div>
        <div class="form-group">
          <label for="category">Category</label>
          <input type="text" id="category" name="category" [(ngModel)]="currentProduct.category" required>
        </div>
        <div class="form-group">
          <label for="image">Image URL</label>
          <input type="text" id="image" name="image" [(ngModel)]="currentProduct.image" required>
        </div>
        <div class="form-group">
          <label for="stock">Stock</label>
          <input type="number" id="stock" name="stock" [(ngModel)]="currentProduct.stock" min="0" required>
        </div>
        <div class="form-buttons">
          <button type="submit" class="save-btn">{{ editMode ? 'Update' : 'Add' }} Product</button>
          <button type="button" *ngIf="editMode" (click)="cancelEdit()" class="cancel-btn">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</div>
